[workspace]
resolver = "3"
members = ["crates/hidpp", "crates/daemon", "crates/ctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/burakgon/mouse-master"
homepage = "https://github.com/burakgon/mouse-master"
authors = ["Burak Gon"]
rust-version = "1.85"

[workspace.dependencies]
hidpp = { path = "crates/hidpp" }
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "fs", "process"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
evdev = "0.13"
udev = "0.9"
libc = "0.2"
dirs = "7.0"
clap = { version = "4.6", features = ["derive"] }
parking_lot = "0.12"
bitflags = "2.13"
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
